name: Host tools
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/make_fel_card.py
      - run: python tools/build_demo.py
      - name: Install Ubuntu host dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libusb-1.0-0-dev squashfs-tools-ng
      - name: Prepare Windows build dependencies
        if: runner.os == 'Windows'
        run: python tools/setup_windows.py
      - run: python tools/build_fel.py
      - name: Check shell syntax
        if: runner.os == 'Linux'
        run: for f in firmware/* demo/*.sh; do sh -n "$f"; done
